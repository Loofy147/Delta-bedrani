[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-matroid-lab"
version = "0.1.0"
description = "Exact research micro-framework for delta-matroids and matching delta-matroids"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Research prototype"}]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
